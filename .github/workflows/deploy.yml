name: Desplegar cliente Angular en GitHub Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Client-Angular
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Client-Angular/package-lock.json

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar pruebas unitarias
        run: npm test -- --runInBand

      - name: Generar build de Angular
        run: npm run build -- --base-href "/${{ github.event.repository.name }}/"

      - name: Configurar fallback para SPA
        run: cp dist/Angular-Standalone-Template/browser/index.html dist/Angular-Standalone-Template/browser/404.html

      - name: Subir artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: Client-Angular/dist/Angular-Standalone-Template/browser

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
